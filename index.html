<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stretching App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- First Stretch -->
    <section id="stretch-1" class="stretch-card active">
        <h1>Cross Leg Stretch</h1>
        <div class="timer">02:00</div>
        <div class="controls">
            <button class="start-btn">Start</button>
            <button class="next-btn">Next Stretch -></button>
        </div>    
    </section>
    <!-- Second Stretch -->
    <section id="stretch-1" class="stretch-card hidden">
        <h1>Deep Squat</h1>
        <div class="timer">02:00</div>
        <div class="controls">
            <button class="start-btn">Start</button>
            <button class="next-btn">Next Stretch -></button>
        </div>    
    </section>
    <!-- Third Stretch -->
    <section id="stretch-1" class="stretch-card hidden">
        <h1>Crossed Leg Leanover</h1>
        <div class="timer">02:00</div>
        <div class="controls">
            <button class="start-btn">Start</button>
            <button class="next-btn">Next Stretch -></button>
        </div>    
    </section>
    <audio id ="chime-sound" src="chime.mp3" preload="auto"></audio>
    
    <script src="script.js"></script>
</body>
</html>
